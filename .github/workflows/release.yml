name: Create Release

run-name: Release LotSizingDataModel from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotsizingdatamodel-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, validate and publish release
    runs-on: windows-latest
    timeout-minutes: 45

    # MSBuild imports valid environment variables as initial properties.
    # NBGV therefore sees PublicRelease=true in every dotnet/MSBuild call.
    env:
      PublicRelease: 'true'

    steps:
      - name: Require main branch
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Releases must be started from the main branch."
          }

      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Graphviz
        shell: pwsh
        run: |
          choco install graphviz -y --no-progress
          cmd /c "dot -V 2>&1"

      - name: Install official Doxygen 1.17.0
        shell: pwsh
        run: |
          $url = "https://github.com/doxygen/doxygen/releases/download/Release_1_17_0/doxygen-1.17.0.windows.x64.bin.zip"
          $zip = Join-Path $env:RUNNER_TEMP "doxygen-1.17.0.zip"
          $dir = Join-Path $env:RUNNER_TEMP "doxygen-1.17.0"
          $expected = "94594407c4cbca3049d76aacbb05d4a6f7d0f4e93c0de410b825d25ca5621c83"

          Invoke-WebRequest -Uri $url -OutFile $zip

          $actual =
            (Get-FileHash $zip -Algorithm SHA256).
            Hash.
            ToLowerInvariant()

          if ($actual -ne $expected) {
            throw "Doxygen SHA-256 mismatch. Expected $expected, got $actual."
          }

          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $exe =
            Get-ChildItem $dir -Recurse -Filter doxygen.exe -File |
            Select-Object -First 1

          if ($null -eq $exe) {
            throw "doxygen.exe was not found in the official archive."
          }

          Add-Content -Path $env:GITHUB_PATH -Value $exe.Directory.FullName
          & $exe.FullName --version

      - name: Automation preflight
        shell: pwsh
        run: |
          ./tools/Test-Automation.ps1

      - name: Full public-release build
        shell: pwsh
        run: |
          ./build/Build-All.ps1

      - name: Prepare and validate release assets
        id: release_info
        shell: pwsh
        run: |
          $release =
            ./build/Prepare-ReleaseAssets.ps1

          "version=$($release.ReleaseVersion)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          "build_version=$($release.BuildVersion)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          "tag=$($release.Tag)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          "commit=$($release.CommitId)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          "prerelease=$($release.Prerelease.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Guard against duplicate tag or release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          # Query the exact remote tag without --exit-code.
          # Git then returns 0 after a successful remote query whether the
          # requested ref exists or not; stdout tells us whether it exists.
          $remoteTag =
            & git ls-remote `
              --tags `
              --refs `
              origin `
              "refs/tags/$env:RELEASE_TAG"

          if ($LASTEXITCODE -ne 0) {
            throw (
              "Unable to query remote Git tags for '$env:RELEASE_TAG'. " +
              "git ls-remote exited with code $LASTEXITCODE."
            )
          }

          $remoteTagText = ($remoteTag | Out-String).Trim()

          if (-not [string]::IsNullOrWhiteSpace($remoteTagText)) {
            throw "Git tag '$env:RELEASE_TAG' already exists."
          }

          Write-Host "Tag and release are available: $env:RELEASE_TAG"

          # Explicitly terminate this guard step successfully.
          exit 0

      - name: Upload release bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: LotSizingDataModel-${{ steps.release_info.outputs.version }}-release-bundle
          path: Documentation/release
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.release_info.outputs.prerelease }}
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            throw "GitHub CLI 'gh' is not available on the runner."
          }

          $assets =
            Get-ChildItem -LiteralPath "Documentation\release" -File |
            Sort-Object Name |
            ForEach-Object { $_.FullName }

          if ($assets.Count -eq 0) {
            throw "No release assets were prepared."
          }

          $arguments = @(
            "release",
            "create",
            $env:RELEASE_TAG
          )

          $arguments += $assets

          $arguments += @(
            "--repo",
            $env:GITHUB_REPOSITORY,
            "--target",
            $env:GITHUB_SHA,
            "--title",
            "LotSizingDataModel $env:RELEASE_VERSION",
            "--generate-notes"
          )

          if ($env:RELEASE_PRERELEASE -eq "true") {
            $arguments += "--prerelease"
            $arguments += "--latest=false"
          }

                    & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed."
          }

      - name: Release summary
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
          BUILD_VERSION: ${{ steps.release_info.outputs.build_version }}
          RELEASE_COMMIT: ${{ steps.release_info.outputs.commit }}
          RELEASE_PRERELEASE: ${{ steps.release_info.outputs.prerelease }}
        run: |
          @"
          ## LotSizingDataModel $env:RELEASE_VERSION

          - Tag: $env:RELEASE_TAG
          - Build version: $env:BUILD_VERSION
          - Commit: $env:RELEASE_COMMIT
          - Prerelease: $env:RELEASE_PRERELEASE

          - Binary ZIP, documentation ZIP, build metadata, solver manifest,
            release manifest and SHA-256 checksums were validated before publication.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8