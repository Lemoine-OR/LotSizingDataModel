name: Build Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  documentation:
    name: Build and validate public Doxygen documentation
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Graphviz
        shell: pwsh
        run: |
          choco install graphviz -y --no-progress
          cmd /c "dot -V 2>&1"

      - name: Install official Doxygen 1.17.0
        shell: pwsh
        run: |
          $url = "https://www.doxygen.nl/files/doxygen-1.17.0.windows.x64.bin.zip"
          $zip = Join-Path $env:RUNNER_TEMP "doxygen-1.17.0.zip"
          $dir = Join-Path $env:RUNNER_TEMP "doxygen-1.17.0"
          $expected = "94594407c4cbca3049d76aacbb05d4a6f7d0f4e93c0de410b825d25ca5621c83"

          Invoke-WebRequest -Uri $url -OutFile $zip

          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Doxygen SHA-256 mismatch. Expected $expected, got $actual."
          }

          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $exe = Get-ChildItem $dir -Recurse -Filter doxygen.exe -File |
            Select-Object -First 1

          if ($null -eq $exe) {
            throw "doxygen.exe was not found in the official archive."
          }

          Add-Content -Path $env:GITHUB_PATH -Value $exe.Directory.FullName
          & $exe.FullName --version

      - name: Build and validate documentation portal
        shell: pwsh
        run: |
          ./docs/build-documentation.ps1

      - name: Upload complete documentation artifact
        uses: actions/upload-artifact@v5
        with:
          name: LotSizingDataModel-Documentation
          path: Documentation/site
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: Documentation/site

  deploy:
    name: Deploy documentation to GitHub Pages
    if: github.event_name != 'pull_request'
    needs:
      - documentation
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
