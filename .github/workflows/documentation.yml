name: Build Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  documentation:
    name: Build Doxygen documentation
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Doxygen and Graphviz
        shell: pwsh
        run: |
          choco install doxygen.install graphviz -y --no-progress
          doxygen --version
          dot -V

      - name: Generate Doxygen documentation
        shell: pwsh
        run: |
          doxygen Doxyfile-LotSizingDataModel.Core

      - name: Prepare generated HTML
        shell: pwsh
        run: |
          $source = Join-Path $PWD "Documentation\html"

          if (-not (Test-Path (Join-Path $source "index.html"))) {
            throw "Doxygen did not generate Documentation/html/index.html."
          }

          $target = Join-Path $PWD "dist\documentation\html"

          New-Item -ItemType Directory -Force $target | Out-Null

          Copy-Item `
            -Path "$source\*" `
            -Destination $target `
            -Recurse `
            -Force

          New-Item `
            -ItemType File `
            -Path (Join-Path $target ".nojekyll") `
            -Force | Out-Null

      - name: Upload Doxygen HTML artifact
        uses: actions/upload-artifact@v5
        with:
          name: LotSizingDataModel-Doxygen-HTML
          path: dist/documentation/html
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/documentation/html


  deploy:
    name: Deploy documentation to GitHub Pages

    if: github.event_name != 'pull_request'

    needs:
      - documentation

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4